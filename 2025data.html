<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ganesh Demo - Previous Year Data</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>

    <style>
        :root {
            --orange: #ff8a00;
            --orange-dark: #e67600;
            --white: #ffffff;
            --text-dark: #222;
            --text-muted: #666;
            --shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--white);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        /* Back button */
        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--orange);
            background-color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
        }

        .back-btn:active {
            transform: translateY(1px) scale(0.97);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #eee;
            background-color: #fff;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--orange);
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .container {
            padding: 1rem;
            max-width: 900px;
            margin: auto;
        }

        /* Card Grid */
        .year-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.9rem;
        }

        @media (min-width: 640px) {
            .year-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 960px) {
            .year-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .year-card {
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: #fff;
            padding: 1rem 1.1rem;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .year-left .year-label {
            font-size: 0.85rem;
            opacity: 0.95;
        }

        .year-left .year-title {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .year-right .money-label {
            font-size: 0.8rem;
            opacity: 0.95;
        }

        .year-right .money-value {
            font-size: 1.4rem;
            font-weight: 700;
            margin-top: 0.15rem;
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            padding: 1rem 0 1.2rem;
            color: #999;
        }

        /* Edit Section Styles */
        .edit-section {
            margin-top: 1.5rem;
            background: #f9f9f9;
            border-radius: 16px;
            padding: 1.2rem;
            border: 1px solid #e5e5e5;
        }

        .edit-btn {
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(255, 138, 0, 0.3);
            transition: transform 0.15s ease;
        }

        .edit-btn:active {
            transform: scale(0.97);
        }

        .edit-form {
            display: none;
            margin-top: 1rem;
        }

        .edit-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-dark);
        }

        .form-input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--orange);
            box-shadow: 0 0 0 2px rgba(255, 138, 0, 0.16);
        }

        .btn-group {
            display: flex;
            gap: 0.6rem;
            margin-top: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: #fff;
            box-shadow: 0 6px 14px rgba(255, 138, 0, 0.3);
        }

        .btn-secondary {
            background: #e7e7e7;
            color: #444;
        }

        .manual-indicator {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0.2rem 0.6rem;
            background: #4caf50;
            color: white;
            font-size: 0.7rem;
            border-radius: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <header class="header">
        <button class="back-btn" type="button" onclick="window.history.back()">
            ←
        </button>
        <img src="assets/images/logo.png" class="logo" alt="Logo">
        <div class="title">Ganesh Demo</div>
    </header>

    <main class="container">
        <h2>Previous Year Collections</h2>
        <p>Viewing data for <b id="prevYearDisplay"></b></p>

        <section class="year-grid">

            <!-- DYNAMIC PREVIOUS YEAR MONEY CARD -->
            <div onclick="goToMoneyCollection()" class="year-card">
                <div class="year-left">
                    <div class="year-label">Year</div>
                    <div class="year-title" id="cardYearTitle">----</div>
                </div>
                <div class="year-right">
                    <div class="money-label">Total Collection</div>
                    <div class="money-value" id="totalCollection">Loading...</div>
                </div>
            </div>

            <!-- DYNAMIC PREVIOUS YEAR ITEMS CARD -->
            <div class="year-card" onclick="window.location.href = `year-items.html?year=${prevYear}`">
                <div class="year-left">
                    <div class="year-label">Year</div>
                    <div class="year-title" id="cardYearItemsTitle">---- Items</div>
                </div>
                <div class="year-right">
                    <div class="money-label">Items Page</div>
                    <div class="money-value">View</div>
                </div>
            </div>

        </section>

        <!-- Manual Entry Section -->
        <section class="edit-section">
            <h3 style="margin-bottom: 0.8rem; font-size: 1.1rem;">Manual Amount Entry</h3>
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 1rem;">
                Click below to manually enter/edit the total collection for <b id="editYearDisplay"></b>
            </p>

            <button class="edit-btn" id="editBtn" onclick="toggleEditForm()">
                ✏️ Edit Amount
            </button>

            <div class="edit-form" id="editForm">
                <div class="form-group">
                    <label class="form-label" for="manualAmount">Amount (₹)</label>
                    <input type="number" id="manualAmount" class="form-input"
                        placeholder="Enter total collection amount" min="0">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="saveManualAmount()">💾 Save</button>
                    <button class="btn btn-secondary" onclick="cancelEdit()">❌ Cancel</button>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        © <span id="year"></span> Ganesh Demo
        <br>
        <a href="https://mangolabz.vercel.app/" target="_blank" style="color: inherit; text-decoration: none; font-weight: bold; display: block; margin-top: 8px;">DESIGNED by mango Labz</a>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();

        const API_BASE = "https://wcyf-app.onrender.com"; // Replace with real URL if needed

        // 1. Determine Previous Year
        const selectedYear = Number(localStorage.getItem("selectedYear")) || new Date().getFullYear();
        const prevYear = selectedYear - 1;

        // 2. Update Strings
        document.getElementById("prevYearDisplay").textContent = prevYear;
        document.getElementById("cardYearTitle").textContent = prevYear;
        document.getElementById("cardYearItemsTitle").textContent = `${prevYear} Items`;
        document.getElementById("editYearDisplay").textContent = prevYear;

        // 3. Navigate Logic
        function goToMoneyCollection() {
            window.location.href = `year-money.html?year=${prevYear}`;
        }

        // 4. Manual Amount Functions
        function toggleEditForm() {
            const form = document.getElementById("editForm");
            const btn = document.getElementById("editBtn");

            if (form.classList.contains("active")) {
                form.classList.remove("active");
                btn.textContent = "✏️ Edit Amount";
            } else {
                form.classList.add("active");
                btn.textContent = "🔽 Hide Form";

                // Load current value
                const manualKey = `manualAmount_${prevYear}`;
                const savedAmount = localStorage.getItem(manualKey);
                if (savedAmount) {
                    document.getElementById("manualAmount").value = savedAmount;
                }
            }
        }

        function saveManualAmount() {
            const input = document.getElementById("manualAmount");
            const amount = Number(input.value);

            if (isNaN(amount) || amount < 0) {
                alert("❌ Please enter a valid positive number");
                return;
            }

            // Save to localStorage
            const manualKey = `manualAmount_${prevYear}`;
            localStorage.setItem(manualKey, amount.toString());

            alert(`✅ Amount saved: ₹${amount.toLocaleString("en-IN")}`);

            // Update display
            updateDisplay();

            // Close form
            toggleEditForm();
        }

        function cancelEdit() {
            document.getElementById("manualAmount").value = "";
            toggleEditForm();
        }

        function clearManualAmount() {
            if (confirm(`⚠️ Clear manual entry for ${prevYear}?`)) {
                const manualKey = `manualAmount_${prevYear}`;
                localStorage.removeItem(manualKey);
                alert("✅ Manual entry cleared");
                updateDisplay();
            }
        }

        // 5. Load and Display Data
        function updateDisplay() {
            const manualKey = `manualAmount_${prevYear}`;
            const manualAmount = localStorage.getItem(manualKey);

            if (manualAmount) {
                // Show manual amount with indicator
                const amount = Number(manualAmount);
                document.getElementById("totalCollection").innerHTML =
                    `₹ ${amount.toLocaleString("en-IN")} <span class="manual-indicator">Manual</span>`;
            } else {
                // Load from API
                loadDataFromAPI();
            }
        }

        async function loadDataFromAPI() {
            try {
                const res = await fetch(`${API_BASE}/api/money?year=${prevYear}`);
                if (!res.ok) throw new Error("API Error");

                const data = await res.json();

                let total = 0;
                (data || []).forEach(entry => {
                    total += Number(entry.amount) || 0;
                });

                document.getElementById("totalCollection").textContent = "₹ " + total.toLocaleString("en-IN");

            } catch (err) {
                console.error(err);
                document.getElementById("totalCollection").textContent = "₹ 0";
            }
        }

        // Initialize
        updateDisplay();

    </script>

</body>

</html>
