<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Ganesh Demo - Special List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <!-- PWA manifest & theme -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ff8a00">

    <!-- iOS (iPhone / iPad) PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="assets/images/logo-192.png">

    <style>
        :root {
            --orange: #ff8a00;
            --orange-dark: #e67600;
            --white: #ffffff;
            --bg-light: #fafafa;
            --text-dark: #222;
            --text-muted: #777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background-color: var(--white);
            color: var(--text-dark);
            min-height: 100vh;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #eee;
            background-color: #fff;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--orange);
            background-color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 0.5rem;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
            color: var(--text-dark);
            text-decoration: none;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--orange);
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .container {
            padding: 1.5rem 1rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .page-header h2 {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: var(--text-muted);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .nav-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: #fff;
            padding: 1.5rem;
            border-radius: 18px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 138, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .nav-card:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(255, 138, 0, 0.2);
        }

        .nav-card-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .nav-card-icon {
            font-size: 1.5rem;
        }

        .footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header class="header">
        <a href="home.html" class="back-btn">←</a>
        <img src="assets/images/logo.png" alt="Logo" class="logo">
        <div class="title">Ganesh Demo</div>
    </header>

    <main class="container">
        <section class="page-header">
            <h2>Special List</h2>
            <p>Select a category to view or add entries</p>
        </section>

        <div class="nav-links">
            <a href="laddu.html" class="nav-card">
                <span class="nav-card-title">Laddu</span>
                <span class="nav-card-icon">🍛</span>
            </a>

            <a href="ganesh-bomma.html" class="nav-card">
                <span class="nav-card-title">Ganesh Bomma</span>
                <span class="nav-card-icon">🗿</span>
            </a>

            <a href="photos.html" class="nav-card">
                <span class="nav-card-title">Ganesh Photos</span>
                <span class="nav-card-icon">📸</span>
            </a>
        </div>
    </main>

    <footer class="footer">
        ©
        <script>document.write(new Date().getFullYear())</script> Ganesh Demo
        <br>
        <a href="https://mangolabz.vercel.app/" target="_blank" style="color: inherit; text-decoration: none; font-weight: bold; font-size: 0.85rem; display: block; margin-top: 8px;">DESIGNED by mango Labz</a>
    </footer>

</body>

</html>
