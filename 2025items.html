<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>WCYF - 2025 Items Collection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest">
    <script>
      if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("service-worker.js");
      }
    </script>

    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <style>
        :root {
            --orange: #ff8a00;
            --orange-dark: #e67600;
            --white: #fff;
            --bg-light: #fafafa;
            --text-dark: #222;
            --text-muted: #666;
            --border: #e5e5e5;
            --shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--white);
            color: var(--text-dark);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.9rem 1rem;
            background: var(--white);
            border-bottom: 1px solid #ddd;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--orange);
            background: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid var(--orange);
        }

        .title {
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
        }

        .container {
            padding: 1rem;
            max-width: 900px;
            margin: auto;
        }

        /* Search */
        .search-input {
            width: 100%;
            padding: 0.55rem 0.9rem;
            border-radius: 999px;
            border: 1px solid #ccc;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* List */
        .list-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .header-row,
        .item-row {
            display: grid;
            grid-template-columns: 1fr 2fr;
            padding: 0.6rem 0.9rem;
            border-bottom: 1px solid #eee;
        }

        .header-row {
            font-size: 0.78rem;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .name {
            font-weight: 600;
        }

        .empty {
            padding: 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Export button */
        .export-btn {
            margin-top: 1rem;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            display: inline-block;
        }
    </style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="window.location.href='previous-years.html'">←</button>
    <img src="assets/images/logo.png" class="logo">
    <div class="title">2025 Items</div>
</header>

<main class="container">

    <input type="text" id="searchInput" class="search-input" placeholder="Search items…">

    <section class="list-card">
        <div class="header-row">
            <div>Name</div>
            <div>Items</div>
        </div>

        <div id="itemsContainer">
            <div class="empty">Loading…</div>
        </div>
    </section>

    <button class="export-btn" id="exportBtn">📊 Export Items</button>
</main>

<footer style="text-align:center; padding:1rem; color:#777; font-size:0.8rem;">
    © <span id="year"></span> WCYF
        <br>
        <a href="https://mangolabz.vercel.app/" target="_blank" style="color: inherit; text-decoration: none; font-weight: bold; font-size: 0.85rem; display: block; margin-top: 8px;">DESIGNED by mango Labz</a>
    </footer>

<!-- XLSX -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

let itemsData = [];
let suggestionData = [];

/* ============================
   LOAD ITEMS FROM JSON
============================ */
async function loadItems() {
    try {
        const res = await fetch("assets/data/2025items.json");
        const data = await res.json();

        itemsData = data.map(e => ({
            name: e.Name,
            items: e.Items
        }));

        renderItems();
    } catch (err) {
        console.error("Load error:", err);
        document.getElementById("itemsContainer").innerHTML =
            `<div class='empty'>Failed to load items</div>`;
    }
}

/* ============================
   NAME SUGGESTION LOADER
============================ */
async function loadSuggestionData() {
    suggestionData = [];

    try {
        const res = await fetch("assets/data/2025items.json");
        if (res.ok) {
            const data = await res.json();

            data.forEach(item => {
                suggestionData.push({
                    name: item.Name,
                    preview: item.Items,
                    type: "item"
                });
            });
        }
    } catch (err) {
        console.error("Error loading 2025items.json:", err);
    }
}

/* ============================
   RENDER ITEMS LIST
============================ */
function renderItems() {
    const search = document.getElementById("searchInput").value.toLowerCase();
    const container = document.getElementById("itemsContainer");
    container.innerHTML = "";

    const filtered = itemsData.filter(e =>
        e.name.toLowerCase().includes(search) ||
        e.items.toLowerCase().includes(search)
    );

    if (filtered.length === 0) {
        container.innerHTML = `<div class="empty">No matching items</div>`;
        return;
    }

    filtered.forEach(e => {
        const row = document.createElement("div");
        row.className = "item-row";

        row.innerHTML = `
            <div class="name">${e.name}</div>
            <div>${e.items}</div>
        `;

        container.appendChild(row);
    });
}

/* ============================
   EXPORT TO EXCEL
============================ */
document.getElementById("exportBtn").addEventListener("click", () => {
    if (itemsData.length === 0) return alert("No items to export");

    const ws = XLSX.utils.json_to_sheet(itemsData);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "2025 Items");

    XLSX.writeFile(wb, "2025_items.xlsx");
});


const API_BASE = "";
 // <-- replace with your real Render URL

/* ============================ */
document.getElementById("searchInput").addEventListener("input", renderItems);

/* INITIALIZE */
loadItems();
loadSuggestionData();
</script>

</body>
</html>
