<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>2025 Collection - Ganesh Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="assets/images/logo.png">

<link rel="manifest" href="manifest.webmanifest">
<script>
  if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
  }
</script>


<style>
    body { font-family: system-ui; margin: 0; background: #fff; }
    .header {
        display: flex; align-items: center; gap: .75rem;
        padding: 1rem; border-bottom: 1px solid #eee;
    }
    .back-btn {
        width: 36px; height: 36px; border-radius: 50%;
        border: 1px solid #ff8a00; background: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; cursor: pointer;
    }
    .logo {
        width: 46px; height: 46px; border-radius: 50%;
        border: 2px solid #ff8a00;
    }
    .title { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; }

    .container { max-width: 900px; margin: auto; padding: 1rem; }

    .summary {
        background: linear-gradient(135deg, #ff8a00, #e67600);
        color: white; padding: 1.2rem;
        border-radius: 18px; margin: 1rem 0;
        text-align: center;
        font-size: 1.5rem; font-weight: bold;
    }

    .list-card {
        background: #fff; border-radius: 16px;
        border: 1px solid #eee; padding: 0.5rem;
    }

    .row {
        display: grid;
        grid-template-columns: 2fr 1fr;
        padding: .7rem;
        border-bottom: 1px solid #f5f5f5;
        font-size: .95rem;
    }
    .row:last-child { border-bottom: none; }

    .footer { text-align: center; padding: 1rem; font-size: .8rem; color: #777; }
</style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="location.href='previous-years.html'">←</button>
    <img src="assets/images/logo.png" class="logo">
    <div class="title">Ganesh Demo</div>
</header>

<div class="container">
    <h2>2025 Collection</h2>
    <p>List of all contributors</p>

    <div class="summary">
        ₹ <span id="totalAmount">0</span>
    </div>

    <section class="list-card" id="listContainer">
        <div class="row"><b>Name</b> <b>Amount</b></div>
    </section>
</div>

<footer class="footer">© 2025 Ganesh Demo
        <br>
        <a href="https://mangolabz.vercel.app/" target="_blank" style="color: inherit; text-decoration: none; font-weight: bold; font-size: 0.85rem; display: block; margin-top: 8px;">DESIGNED by mango Labz</a>
    </footer>

<script>

    const API_BASE = "";
 // <-- replace with your real Render URL

async function load2025Money() {
    const res = await fetch("assets/data/2025money.json");
    const data = await res.json();

    const list = document.getElementById("listContainer");
    let total = 0;

    data.forEach(item => {
        const name = item.Name || "";
        const amt = parseInt((item.Amount || "").replace(/\D/g, "")) || 0;

        total += amt;

        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<div>${name}</div><div>₹ ${amt}</div>`;
        list.appendChild(row);
    });

    document.getElementById("totalAmount").textContent = total.toLocaleString("en-IN");
}

load2025Money();
</script>

</body>
</html>
