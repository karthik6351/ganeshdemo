<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Collection - Ganesh Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo.png">

    <link rel="manifest" href="manifest.webmanifest">
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>

    <style>
        :root {
            --orange: #ff8a00;
            --orange-dark: #e67600;
            --white: #ffffff;
            --text-dark: #222;
            --text-muted: #666;
            --shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
        }

        body {
            font-family: system-ui, sans-serif;
            background-color: var(--white);
            margin: 0;
            padding: 0;
            color: var(--text-dark);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #eee;
            background-color: #fff;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--orange);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 2px solid var(--orange);
            object-fit: cover;
        }

        .title {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 1rem;
        }

        .summary-card {
            background: linear-gradient(135deg, var(--orange), var(--orange-dark));
            color: #fff;
            padding: 1.5rem;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }

        .summary-label {
            font-size: 0.9rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .list-card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #eee;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .list-header {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 0.8rem 1rem;
            background: #fcfcfc;
            border-bottom: 1px solid #eee;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .list-item {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #f5f5f5;
            align-items: center;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
            color: #333;
        }

        .item-date {
            font-size: 0.75rem;
            color: #888;
            margin-top: 2px;
        }

        .item-amount {
            font-weight: 700;
            font-size: 1.05rem;
            color: #000;
        }

        .footer {
            text-align: center;
            padding: 2rem 1rem;
            font-size: 0.8rem;
            color: #999;
        }

        .loading,
        .error,
        .empty {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .error {
            color: #d32f2f;
        }
    </style>
</head>

<body>

    <header class="header">
        <button class="back-btn" onclick="window.history.back()">←</button>
        <img src="assets/images/logo.png" class="logo" alt="Logo">
        <div class="title">Ganesh Demo</div>
    </header>

    <main class="container">
        <h2 id="pageTitle">... Collection</h2>
        <p>List of contributors for <span id="yearDisplay">...</span></p>

        <div class="summary-card">
            <div class="summary-label">Total Collection</div>
            <div class="summary-value">₹ <span id="totalAmount">0</span></div>
        </div>

        <section class="list-card">
            <div class="list-header">
                <div>Name</div>
                <div>Amount</div>
            </div>
            <div id="listContainer">
                <div class="loading">Loading data...</div>
            </div>
        </section>
    </main>

    <footer class="footer">
        © <span id="currentYear"></span> Ganesh Demo
        <br>
        <a href="https://mangolabz.vercel.app/" target="_blank" style="color: inherit; text-decoration: none; font-weight: bold; font-size: 0.85rem; display: block; margin-top: 8px;">DESIGNED by mango Labz</a>
    </footer>

    <script>
        document.getElementById("currentYear").textContent = new Date().getFullYear();
        const API_BASE = "";

        // Get year from URL
        const urlParams = new URLSearchParams(window.location.search);
        const yearParam = urlParams.get('year');
        const year = yearParam ? Number(yearParam) : new Date().getFullYear();

        // Update UI
        document.title = `${year} Collection - Ganesh Demo`;
        document.getElementById("pageTitle").textContent = `${year} Collection`;
        document.getElementById("yearDisplay").textContent = year;

        async function loadData() {
            const listContainer = document.getElementById("listContainer");
            const totalEl = document.getElementById("totalAmount");

            try {
                const res = await fetch(`${API_BASE}/api/money?year=${year}`);
                if (!res.ok) throw new Error("Failed to load data");

                const data = await res.json();

                // Filter only items with amount > 0
                const moneyItems = (data || []).filter(item => Number(item.amount) > 0);

                if (moneyItems.length === 0) {
                    listContainer.innerHTML = `<div class="empty">No contributions found for ${year}.</div>`;
                    totalEl.textContent = "0";
                    return;
                }

                // Calculate total
                const total = moneyItems.reduce((sum, item) => sum + Number(item.amount), 0);
                totalEl.textContent = total.toLocaleString("en-IN");

                // Helper to parse DD-MM-YYYY to Date
                function parseDate(dateStr) {
                    if (!dateStr) return new Date(0);
                    const [d, m, y] = dateStr.split("-");
                    return new Date(`${y}-${m}-${d}`);
                }

                // Sort descending by date
                moneyItems.sort((a, b) => parseDate(b.date) - parseDate(a.date));

                // Render List
                let html = "";
                moneyItems.forEach(item => {
                    const dateStr = item.date ? `<div class="item-date">${item.date}</div>` : "";
                    html += `
                        <div class="list-item">
                            <div>
                                <div class="item-name">${item.name || "Unknown"}</div>
                                ${dateStr}
                            </div>
                            <div class="item-amount">₹ ${Number(item.amount).toLocaleString("en-IN")}</div>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;

            } catch (err) {
                console.error(err);
                listContainer.innerHTML = `<div class="error">Error loading data.</div>`;
            }
        }

        loadData();
    </script>

</body>

</html>
